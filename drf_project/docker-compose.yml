services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: sunny1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: lms_db
      DB_USER: lms_user
      DB_PASSWORD: sunny1234
      DB_PORT: "5432"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
